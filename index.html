<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>هاشم AI</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0d1020;color:#f4f4ff;font-family:Tahoma,Arial,sans-serif}main{max-width:680px;margin:auto;padding:22px 16px 44px}.hero,.card{padding:18px;border:1px solid #34345d;border-radius:20px;background:#15192a;margin-bottom:14px}h1{margin:0 0 8px}.sub,small{color:#c6c8e8;line-height:1.9;font-size:14px}label{display:block;margin:14px 0 8px;font-weight:bold}input,textarea,button{font:inherit;width:100%;border-radius:12px}input[type=file],textarea{padding:12px;border:1px solid #454966;background:#0e1220;color:#fff}textarea{min-height:105px}button{margin-top:14px;padding:13px;border:0;background:#8b72ff;color:#fff;font-weight:bold}#status{margin-top:12px;white-space:pre-wrap;line-height:1.9}img{display:block;max-width:100%;border-radius:14px;margin-top:16px}small{display:block;margin-top:12px}</style></head><body><main><section class="hero"><h1>✨ هاشم AI</h1><div class="sub">عکست را انتخاب کن و تغییر دلخواهت را بنویس.</div></section><section class="card"><form id="form"><label>۱) انتخاب عکس</label><input name="image" type="file" accept="image/png,image/jpeg,image/webp" required><label>۲) چه تغییری می‌خواهی؟</label><textarea name="prompt" maxlength="1500" required placeholder="مثلاً: لباس ابرقهرمانی سینمایی اضافه کن و چهره‌ام را تا جای ممکن حفظ کن."></textarea><button id="submit">ساخت عکس ویرایش‌شده</button></form><div id="status">برای کارکردن، API باید روی سرور تنظیم شده باشد.</div><img id="result" alt="عکس ویرایش‌شده" hidden><a id="download" hidden download="hashem-ai-edited.png" style="display:block;margin-top:12px;color:#c7bcff">ذخیره عکس</a><small>کلید API را هرگز در این صفحه قرار نده. این پروژه تا زمان میزبانی و تنظیم API آنلاین نیست.</small></section></main><script>
const form=document.querySelector("#form"),statusBox=document.querySelector("#status"),btn=document.querySelector("#submit"),result=document.querySelector("#result"),download=document.querySelector("#download");form.addEventListener("submit",async e=>{e.preventDefault();btn.disabled=true;statusBox.textContent="در حال ویرایش…";result.hidden=true;download.hidden=true;try{const r=await fetch("/api/edit",{method:"POST",body:new FormData(form)}),j=await r.json();if(!r.ok)throw Error(j.error||"خطا");result.src=j.image;result.hidden=false;download.href=j.image;download.hidden=false;statusBox.textContent="تمام شد!";}catch(e){statusBox.textContent=e.message||"ارتباط برقرار نشد."}finally{btn.disabled=false}});
</script></body></html>
